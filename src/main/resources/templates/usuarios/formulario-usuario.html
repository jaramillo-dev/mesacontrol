<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Mesa de Control - Editar Usuario' : 'Mesa de Control - Nuevo Usuario'">Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0">
                    <i class="bi" th:classappend="${modoEdicion} ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
                    <span th:text="${modoEdicion} ? ' Editar Usuario' : ' Nuevo Usuario'">Usuario</span>
                </h2>
                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Volver al listado
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="card-title mb-0 text-secondary" th:text="${modoEdicion} ? 'Actualice los datos del usuario' : 'Ingrese los datos del nuevo usuario'"></h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="${modoEdicion} ? @{/usuarios/{id}/editar(id=${usuarioId})} : @{/usuarios/nuevo}"
                          th:object="${usuarioRequest}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="Ej. Juan Pérez">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="ejemplo@imss.gob.mx">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold">Rol del Sistema <span class="text-danger">*</span></label>
                            <select class="form-select" id="rol" th:field="*{rol}"
                                    th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid' : ''">
                                <option value="" disabled selected>Seleccione un rol...</option>
                                <option value="ADMIN">Administrador (Mesa de Control)</option>
                                <option value="VENTAS">Ventas</option>
                                <option value="TECNICO">Técnico</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                Contraseña
                                <span th:if="${!modoEdicion}" class="text-danger">*</span>
                                <span th:if="${modoEdicion}" class="text-muted small">(opcional)</span>
                            </label>

                            <input type="password" class="form-control" id="password"
                                   th:field="*{password}"
                                   th:required="${!modoEdicion}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Mínimo 8 caracteres">

                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

                            <div th:if="${modoEdicion}" class="form-text mt-2 text-primary">
                                <i class="bi bi-info-circle-fill me-1"></i>
                                Deje este campo en blanco si no desea cambiar la contraseña actual.
                            </div>
                        </div>

                        <hr class="mb-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/usuarios}" class="btn btn-light border">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Guardar Usuario
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
