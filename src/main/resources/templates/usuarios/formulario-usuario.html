<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${modoEdicion} ? 'Mesa de Control - Editar Usuario' : 'Mesa de Control - Nuevo Usuario'">Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --app-bg: #f5f7fb;
            --app-card: #ffffff;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--app-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
        }

        /* Tarjeta moderna libre de bordes toscos */
        .card {
            border-radius: var(--radius-lg) !important;
            border: none !important;
        }

        /* Inputs y selectores con bordes suavizados y foco iluminado premium */
        .btn, .form-select, .form-control {
            border-radius: var(--radius-md) !important;
            transition: var(--transition-smooth);
        }

        .form-select:focus, .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .btn {
            font-weight: 500;
        }
        .btn:hover {
            transform: translateY(-1px);
        }

        /* Contenedor del encabezado de la página */
        .page-header {
            background-color: var(--app-card);
            padding: 1.75rem 2rem;
            border-radius: var(--radius-lg);
        }

        .page-header h2 {
            color: var(--blue-main);
            font-size: 1.5rem;
        }

        .hover-danger {
            transition: var(--transition-smooth);
        }
        .hover-danger:hover {
            color: #dc3545 !important;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<div class="container mt-5 mb-5" style="max-width: 750px;">

    <div class="page-header shadow-sm mb-4">
        <a th:href="@{/usuarios}" class="text-decoration-none text-muted small fw-medium d-inline-flex align-items-center mb-2 hover-danger">
            <i class="bi bi-arrow-left me-1"></i> Volver al listado
        </a>
        <h2 class="fw-bold text-dark m-0 d-flex align-items-center mt-1">
            <i class="bi text-primary me-3 fs-3"
               th:classappend="${modoEdicion} ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
            <span th:text="${modoEdicion} ? ' Editar Usuario' : ' Nuevo Usuario'">Usuario</span>
        </h2>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">

            <form th:action="${modoEdicion} ? '/usuarios/' + ${usuarioId} + '/editar' : '/usuarios/nuevo'" th:object="${usuarioRequest}" method="post">

                <div class="row g-4">

                    <div class="col-12">
                        <label for="nombre" class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Nombre Completo *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-bounding-box"></i></span>
                            <input type="text" class="form-control px-3 py-2 text-dark border-start-0"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="Nombre y apellidos">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                    </div>

                    <div class="col-12 border-top pt-3">
                        <label for="email" class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Email Institucional *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope-at-fill"></i></span>
                            <input type="email" class="form-control px-3 py-2 font-monospace text-dark border-start-0"
                                   id="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="correo@ejemplo.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="col-12 border-top pt-3">
                        <label for="rol" class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Rol Asignado del Sistema *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-shield-check"></i>
                             </span>

                            <select class="form-select px-3 py-2 fw-medium text-dark border-start-0"
                                    id="rol"
                                    th:field="*{rol}"
                                    th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid' : ''">

                                <option value="">Seleccione un rol...</option>

                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r}">
                                </option>
                            </select>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('rol')}"
                                 th:errors="*{rol}">
                            </div>
                        </div>
                    </div>

                    <div class="col-12 border-top pt-3">
                        <label for="password" class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Contraseña de Acceso *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control px-3 py-2 text-dark border-start-0"
                                   id="password"
                                   th:field="*{password}"
                                   th:required="${!modoEdicion}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Mínimo 8 caracteres">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div th:if="${modoEdicion}" class="form-text mt-2 text-primary small d-flex align-items-center gap-1.5 fw-medium">
                            <i class="bi bi-info-circle-fill fs-6"></i>
                            <span>Deje este campo en blanco si no desea cambiar la contraseña actual.</span>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-4 pt-3 border-top">
                        <a th:href="@{/usuarios}" class="btn btn-light border text-secondary px-4 py-2 me-2 shadow-sm">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 py-2 shadow-sm">
                            <i class="bi bi-save-fill me-2 fs-7"></i> Guardar Usuario
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
