<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mesa de Control - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2 text-dark fw-bold">Mesa de Control</h3>
            <p class="text-muted small">Inicie sesión para acceder al sistema</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div class="small">Correo o contraseña incorrectos.</div>
        </div>

        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center py-2" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <div class="small">Ha cerrado sesión correctamente.</div>
        </div>

        <div th:if="${param.expired}" class="alert alert-warning d-flex align-items-center py-2" role="alert">
            <i class="bi bi-clock-history me-2"></i>
            <div class="small">Su sesión ha expirado o se abrió en otro dispositivo.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" id="username" name="username" class="form-control border-start-0"
                           placeholder="" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0"
                           placeholder="" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
