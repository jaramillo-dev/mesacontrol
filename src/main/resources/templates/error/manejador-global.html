<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${codigo + ' - ' + titulo}">Error - Mesa de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --app-bg: #f5f7fb;
            --app-card: #ffffff;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--app-bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Tarjeta moderna flotante */
        .card {
            border-radius: var(--radius-lg) !important;
            border: none !important;
        }

        /* Botones estilizados y con micro-interacciones */
        .btn {
            border-radius: var(--radius-md);
            transition: var(--transition-smooth);
            font-weight: 500;
        }
        .btn:hover {
            transform: translateY(-1px);
        }

        /* Contenedores circulares suaves para los íconos de estado de error */
        .error-icon-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body p-5 text-center">

                    <div class="mb-4 mt-2">
                        <div th:if="${codigo == 401 or codigo == 403}" class="error-icon-container bg-danger-subtle text-danger">
                            <i class="bi bi-shield-lock-fill fs-1"></i>
                        </div>

                        <div th:if="${codigo == 404}" class="error-icon-container bg-warning-subtle text-dark">
                            <i class="bi bi-search-heart-fill fs-1 text-warning"></i>
                        </div>

                        <div th:if="${codigo == 400 or codigo == 409}" class="error-icon-container bg-info-subtle text-info">
                            <i class="bi bi-exclamation-circle-fill fs-1"></i>
                        </div>

                        <div th:if="${codigo == 500}" class="error-icon-container bg-danger-subtle text-danger">
                            <i class="bi bi-cloud-slash-fill fs-1"></i>
                        </div>

                        <div th:if="${codigo != 401 and codigo != 403 and codigo != 404 and codigo != 400 and codigo != 409 and codigo != 500}"
                             class="error-icon-container bg-secondary-subtle text-secondary">
                            <i class="bi bi-patch-question-fill fs-1"></i>
                        </div>
                    </div>

                    <h1 class="display-5 fw-bold text-dark mb-2" th:text="${codigo}">500</h1>
                    <h4 class="fw-bold text-secondary mb-3" th:text="${titulo}">Título del Error</h4>

                    <p class="text-muted mb-2 small fw-medium">
                        <i class="bi bi-info-circle-fill me-1"></i> Detalle del inconveniente:
                    </p>
                    <div class="p-3 bg-light rounded-3 border text-start mb-4">
                        <p class="mb-0 small font-monospace text-secondary lh-base">
                            <span th:text="${mensaje}">Error interno del sistema</span>
                        </p>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center mt-3">

                        <th:block th:if="${codigo == 401}">
                            <a th:href="@{/login}" class="btn btn-primary px-4 py-2 shadow-sm d-inline-flex align-items-center justify-content-center">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ir al Login
                            </a>
                        </th:block>

                        <th:block th:unless="${codigo == 401}">
                            <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2 shadow-sm d-inline-flex align-items-center justify-content-center">
                                <i class="bi bi-house-door-fill me-2"></i>Ir al Dashboard
                            </a>
                            <button onclick="window.history.back()"
                                    class="btn btn-outline-secondary px-4 py-2 d-inline-flex align-items-center justify-content-center">
                                <i class="bi bi-arrow-left-short me-1 fs-5"></i>
                                Volver atrás
                            </button>
                        </th:block>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
