<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${codigo + ' - ' + titulo}">Error - Mesa de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border mb-4">
                <div class="card-body py-3 text-center">

                    <div class="mb-4 mt-3">
                        <i th:if="${codigo == 401 or codigo == 403}"
                           class="bi bi-shield-lock-fill text-danger" style="font-size: 5rem;"></i>

                        <i th:if="${codigo == 404}"
                           class="bi bi-search text-warning" style="font-size: 5rem;"></i>

                        <i th:if="${codigo == 400 or codigo == 409}"
                           class="bi bi-exclamation-circle-fill text-info" style="font-size: 5rem;"></i>

                        <i th:if="${codigo == 500}"
                           class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
                    </div>

                    <h1 class="display-1 fw-bold text-dark mb-0" th:text="${codigo}">400</h1>
                    <h3 class="fw-bold text-dark mt-2" th:text="${titulo}">Título del Error</h3>

                    <hr class="my-4">

                    <p class="fs-5 text-muted mb-4" th:text="${mensaje}">
                        Descripción detallada del error generado por el GlobalExceptionHandler o ErrorController.
                    </p>

                    <p class="text-muted small mb-4" th:if="${ruta != null}">
                        <i class="bi bi-link-45deg"></i> Ruta solicitada: <span class="fw-bold" th:text="${ruta}">/ruta</span>
                    </p>

                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mb-3">

                        <th:block th:if="${codigo == 401}">
                            <a th:href="@{/login}" class="btn btn-primary px-4 py-2 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ir al Login
                            </a>
                        </th:block>

                        <th:block th:unless="${codigo == 401}">
                            <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2 fw-bold">
                                <i class="bi bi-house-door-fill me-2"></i>Ir al Dashboard
                            </a>
                            <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2 fw-bold">
                                <i class="bi bi-arrow-left-circle-fill me-2"></i>Volver atrás
                            </button>
                        </th:block>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
