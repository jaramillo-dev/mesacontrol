<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Formulario Ticket - Mesa de Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Bloque de CSS Global para consistencia e identidad visual corporativa unificada -->
  <style>
    :root {
      --app-bg: #f5f7fb;
      --app-card: #ffffff;
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--app-bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #334155;
    }

    /* Tarjeta moderna sin bordes toscos */
    .card {
      border-radius: var(--radius-lg) !important;
      border: none !important;
    }

    /* Botones e inputs con bordes suavizados y transiciones ligeras */
    .btn, .form-select, .form-control {
      border-radius: var(--radius-md) !important;
      transition: var(--transition-smooth);
    }

    .form-select:focus, .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }

    .btn {
      font-weight: 500;
    }
    .btn:hover {
      transform: translateY(-1px);
    }

    /* Encabezado contenedor de la página */
    .page-header {
      background-color: var(--app-card);
      padding: 1.75rem 2rem;
      border-radius: var(--radius-lg);
    }

    .page-header h2 {
      color: var(--blue-main);
      font-size: 1.50rem;
    }

    .page-header p{
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .hover-danger {
      transition: var(--transition-smooth);
    }
    .hover-danger:hover {
      color: #dc3545 !important;
    }
  </style>
</head>

<body>
<!-- Fragmento de navegación superior unificado -->
<div th:replace="~{fragments/navbar :: navbar('tickets')}"></div>

<div class="container mt-5 mb-4" style="max-width: 850px;">

  <!-- ENCABEZADO DE PÁGINA REFACTORIZADO -->
  <div class="page-header shadow-sm mb-4">
    <a th:href="@{/tickets}" class="text-decoration-none text-muted small fw-medium d-inline-flex align-items-center mb-2 hover-danger">
      <i class="bi bi-arrow-left me-1"></i> Volver al listado general
    </a>
    <h2 class="fw-bold text-dark m-0 d-flex align-items-center mt-1">
      <i class="bi bi-file-earmark-plus-fill text-primary me-3 fs-3"></i>Crear Nuevo Ticket
    </h2>
    <p class="text-muted mb-0 mt-1">Apertura de una nueva solicitud de Venta o Servicio Técnico.</p>
  </div>

  <!-- CONTENEDOR DEL FORMULARIO -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4 p-md-5">
      <form th:action="@{/tickets/nuevo}" th:object="${ticketDTO}" method="POST">

        <div class="row g-4">

          <!-- Tipo de Ticket -->
          <div class="col-md-6">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Tipo de Ticket *</label>
            <select class="form-select px-3 py-2 fw-medium text-dark" th:field="*{tipo}" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
              <option value="">Seleccione el tipo...</option>
              <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.descripcion}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
          </div>

          <!-- Prioridad -->
          <div class="col-md-6">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Prioridad *</label>
            <select class="form-select px-3 py-2 fw-medium text-dark" th:field="*{prioridad}" th:classappend="${#fields.hasErrors('prioridad')} ? 'is-invalid'">
              <option value="">Seleccione urgencia...</option>
              <option th:each="prioridad : ${prioridades}" th:value="${prioridad}" th:text="${prioridad.descripcion}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('prioridad')}" th:errors="*{prioridad}"></div>
          </div>

          <!-- Cliente (Hospital) -->
          <div class="col-12 border-top pt-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Unidad Médica *</label>
            <select class="form-select px-3 py-2 fw-medium text-dark" th:field="*{clienteId}" id="clienteId" th:classappend="${#fields.hasErrors('clienteId')} ? 'is-invalid'">
              <option value="">Seleccione un cliente...</option>
              <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
          </div>

          <!-- Equipo Médico (Carga anidada por JS) -->
          <div class="col-12">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Equipo Médico *</label>
            <select class="form-select px-3 py-2 fw-medium text-dark" th:field="*{equipoId}" id="equipoId" th:classappend="${#fields.hasErrors('equipoId')} ? 'is-invalid'">
              <option value="">Seleccione primero el cliente...</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('equipoId')}" th:errors="*{equipoId}"></div>
          </div>

          <!-- Usuario Responsable (Carga anidada por JS sin mostrar roles) -->
          <div class="col-12">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Usuario Responsable *</label>
            <select class="form-select px-3 py-2 fw-medium text-dark" th:field="*{responsableId}" id="responsableId" th:classappend="${#fields.hasErrors('responsableId')} ? 'is-invalid'">
              <option value="">Seleccione primero el tipo de ticket...</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('responsableId')}" th:errors="*{responsableId}"></div>
          </div>

          <!-- Descripción Inicial -->
          <div class="col-12 border-top pt-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.3px;">Descripción Inicial del Problema *</label>
            <textarea class="form-control px-3 py-2 text-dark" rows="4" th:field="*{descripcionInicial}"
                      th:classappend="${#fields.hasErrors('descripcionInicial')} ? 'is-invalid'"
                      placeholder="Describa la solicitud o falla técnica reportada de forma clara y detallada..."></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcionInicial')}" th:errors="*{descripcionInicial}"></div>
          </div>

          <!-- Botones de Acción Estilizados -->
          <div class="col-12 text-end mt-4 pt-3 border-top">
            <a th:href="@{/tickets}" class="btn btn-light border text-secondary px-4 py-2 me-2 shadow-sm">Cancelar</a>
            <button type="submit" class="btn btn-primary px-4 py-2 shadow-sm">
              <i class="bi bi-save-fill me-2 fs-7"></i>Guardar y Asignar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
  // 1. Recuperamos los valores que el usuario había seleccionado antes del error de validación
  const preselectedEquipoId = /*[[${ticketDTO.equipoId}]]*/ null;
  const preselectedResponsableId = /*[[${ticketDTO.responsableId}]]*/ null;

  const clienteSelect = document.getElementById('clienteId');
  const equipoSelect = document.getElementById('equipoId');
  const tipoSelect = document.getElementById('tipo');
  const responsableSelect = document.getElementById('responsableId');

  // 2. Función modular para cargar equipos e inyectar selección previa
  function cargarEquipos(clienteId, selectedId) {
    equipoSelect.innerHTML = '<option value="">Seleccione un equipo...</option>';
    if(clienteId) {
      equipoSelect.disabled = true;
      fetch(`/tickets/api/equipos?clienteId=${clienteId}`)
              .then(response => response.json())
              .then(data => {
                data.forEach(eq => {
                  const option = document.createElement('option');
                  option.value = eq.id;
                  option.textContent = eq.nombre + ' (S/N: ' + eq.numeroSerie + ')';

                  // Si el equipo coincide con el que estaba seleccionado antes del error, lo re-seleccionamos
                  if (selectedId && eq.id.toString() === selectedId.toString()) {
                    option.selected = true;
                  }

                  equipoSelect.appendChild(option);
                });
                equipoSelect.disabled = false;
              })
              .catch(error => {
                console.error('Error cargando equipos:', error);
                equipoSelect.disabled = false;
              });
    }
  }

  // 3. Función modular para cargar responsables e inyectar selección previa
  function cargarResponsables(tipoTicket, selectedId) {
    responsableSelect.innerHTML = '<option value="">Seleccione asignado...</option>';
    if(tipoTicket) {
      responsableSelect.disabled = true;
      fetch(`/tickets/api/responsables?tipo=${tipoTicket}`)
              .then(response => response.json())
              .then(data => {
                data.forEach(user => {
                  const option = document.createElement('option');
                  option.value = user.id;
                  option.textContent = user.nombre;

                  // Si el usuario coincide con el que estaba seleccionado antes del error, lo re-seleccionamos
                  if (selectedId && user.id.toString() === selectedId.toString()) {
                    option.selected = true;
                  }

                  responsableSelect.appendChild(option);
                });
                responsableSelect.disabled = false;
              })
              .catch(error => {
                console.error('Error cargando responsables:', error);
                responsableSelect.disabled = false;
              });
    }
  }

  // 4. Eventos tradicionales para cuando el operador interactúa manualmente
  clienteSelect.addEventListener('change', function() {
    cargarEquipos(this.value, null);
  });

  tipoSelect.addEventListener('change', function() {
    cargarResponsables(this.value, null);
  });

  // 5. BOOTSTRAP DE ESTADO: Se ejecuta automáticamente al renderizar la página tras un error
  window.addEventListener('DOMContentLoaded', (event) => {
    // Si SpringBoot repobló el select de Cliente, disparamos la carga de sus equipos
    if (clienteSelect.value) {
      cargarEquipos(clienteSelect.value, preselectedEquipoId);
    }
    // Si SpringBoot repobló el select de Tipo, disparamos la carga de sus responsables
    if (tipoSelect.value) {
      cargarResponsables(tipoSelect.value, preselectedResponsableId);
    }
  });
</script>

</body>

</html>
