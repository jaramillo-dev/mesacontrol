# Conexión a Base de Datos
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mesacontrol_db
    username: admin_biometec
    password: admin_password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
  application:
    name: mesacontrol