# .github/workflows/main.yml
name: Build and deploy JAR app to Azure Web App - mvp-spring-demo

on:
  push:
    branches:
      - release/mvp-demo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # 1. Levantamos un contenedor efímero de PostgreSQL para los tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mesacontrol_db
          POSTGRES_USER: admin_biometec
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven' # 2. Agregamos caché para acelerar futuros builds

      - name: Build and Test with Maven
        # 3. Inyectamos las credenciales para que Spring Boot se conecte a la DB del CI
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mesacontrol_db
          SPRING_DATASOURCE_USERNAME: admin_biometec
          SPRING_DATASOURCE_PASSWORD: admin_password
        # 4. Quitamos el skipTests.
        run: mvn clean package

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mvp-spring-demo'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}